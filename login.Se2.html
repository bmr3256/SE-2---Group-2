<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - The Barkery</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link href="auth-styles.Se2.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="breadcrumb-nav">
      <div class="breadcrumb-container">
        <a href="index.Se2.html" class="breadcrumb-link">
          <i class="fas fa-home"></i> Home
        </a>
        <span class="breadcrumb-separator">/</span>
        <span class="breadcrumb-current">Login</span>
      </div>
    </nav>

    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-left">
          <div class="auth-logo">
            <a href="index.Se2.html" title="Back to Home">
              <img src="images/Logo - Black.png" alt="The Barkery Logo" />
            </a>
            <p class="tagline">Where happy tails and healthy treats meet!</p>
          </div>

          <form class="auth-form" id="loginForm" novalidate>
            <div class="form-group">
              <div class="floating-input">
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder=" "
                  required
                  autocomplete="email"
                />
                <label for="email">
                  Email Address <span class="required">*</span>
                </label>
              </div>
              <div class="invalid-feedback">
                Please enter a valid email address
              </div>
            </div>

            <div class="form-group">
              <div class="floating-input">
                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder=" "
                  required
                  autocomplete="current-password"
                />
                <label for="password">
                  Password <span class="required">*</span>
                </label>
                <button
                  type="button"
                  class="toggle-password"
                  onclick="togglePassword('password')"
                  aria-label="Toggle password visibility"
                >
                  <i class="fas fa-eye"></i>
                </button>
              </div>
              <div class="invalid-feedback">Password is required</div>
            </div>

            <div class="form-check-group">
              <input type="checkbox" id="remember" name="remember" />
              <label for="remember">Remember me</label>
            </div>

            <button type="submit" class="btn-auth">
              <span class="btn-text">LOGIN</span>
              <span class="btn-loader" style="display: none">
                <i class="fas fa-spinner fa-spin"></i> Logging in...
              </span>
            </button>

            <div class="form-message" id="formMessage"></div>
          </form>
        </div>

        <div class="auth-right"></div>
      </div>
    </div>

    <div
      id="lockoutToast"
      class="toast align-items-center text-bg-danger border-0"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
      style="
        position: fixed;
        bottom: 1rem;
        right: 1rem;
        display: none;
        z-index: 1055;
      "
    >
      <div class="d-flex">
        <div class="toast-body">
          Too many failed attempts. Please wait 5 min.
        </div>
        <button
          type="button"
          class="btn-close btn-close-white me-2 m-auto"
          onclick="
            document.getElementById('lockoutToast').style.display = 'none'
          "
        ></button>
      </div>
    </div>

    <footer class="auth-footer">
      <div class="footer-content">
        <div class="footer-logo">
          <img src="images/B_logo_black.png" id="B_logo" alt="The Barkery B" />
          <img src="images/Logo - Black.png" alt="The Barkery Logo" />
        </div>
        <div class="footer-copyright">© 2025 The Barkery</div>
        <div class="footer-location">Angeles City, Pampanga</div>
      </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>

    <!-- YOUR ORIGINAL MODULE SCRIPT (UNCHANGED) -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-analytics.js";
      import {
        getAuth,
        signInWithEmailAndPassword,
        sendPasswordResetEmail,
      } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBV5wWoUZDeJYSADjLvQTvAPwggwAppeTI",
        authDomain: "grp2-se.firebaseapp.com",
        projectId: "grp2-se",
        storageBucket: "grp2-se.firebasestorage.app",
        messagingSenderId: "488325990404",
        appId: "1:488325990404:web:2f885df16b18d9057a8d51",
        measurementId: "G-PDT5LV9JX1",
      };

      const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);
      const auth = getAuth(app);

      window.addEventListener("DOMContentLoaded", () => {
        const loginForm = document.getElementById("loginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const btnText = document.querySelector(".btn-text");
        const btnLoader = document.querySelector(".btn-loader");
        const formMessage = document.getElementById("formMessage");
        const loginButton = loginForm.querySelector("button[type='submit']");

        let customMessage = document.createElement("div");
        customMessage.style.color = "red";
        customMessage.style.marginTop = "0.25rem";
        customMessage.style.fontSize = "0.875rem";
        customMessage.id = "customErrorMessage";

        const passwordFormGroup = passwordInput.closest(".form-group");
        passwordFormGroup.appendChild(customMessage);

        let lockoutToast = document.createElement("div");
        lockoutToast.id = "lockoutToast";
        lockoutToast.className =
          "toast align-items-center text-bg-danger border-0";
        lockoutToast.role = "alert";
        lockoutToast.ariaLive = "assertive";
        lockoutToast.ariaAtomic = "true";
        lockoutToast.style.position = "fixed";
        lockoutToast.style.bottom = "1rem";
        lockoutToast.style.right = "1rem";
        lockoutToast.style.display = "none";
        lockoutToast.innerHTML = `
      <div class="d-flex">
        <div class="toast-body">Too many failed attempts. Try again in 5 minutes.</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" onclick="document.getElementById('lockoutToast').style.display='none'"></button>
      </div>
    `;
        document.body.appendChild(lockoutToast);

        let failedAttempts =
          parseInt(localStorage.getItem("failedAttempts")) || 0;

        const lockUntil = parseInt(localStorage.getItem("lockUntil"));
        if (lockUntil && Date.now() < lockUntil) {
          loginButton.disabled = true;
          lockoutToast.style.display = "block";

          setTimeout(() => {
            loginButton.disabled = false;
            lockoutToast.style.display = "none";
            localStorage.removeItem("lockUntil");
            failedAttempts = 0;
            localStorage.setItem("failedAttempts", failedAttempts);
          }, lockUntil - Date.now());
        }

        loginForm.addEventListener("submit", async (e) => {
          e.preventDefault();

          const lockUntil = parseInt(localStorage.getItem("lockUntil"));
          if (lockUntil && Date.now() < lockUntil) {
            lockoutToast.style.display = "block";
            emailInput.style.border = "1px solid red";
            passwordInput.style.border = "1px solid red";
            loginButton.disabled = true;
            return;
          }

          const email = emailInput.value.trim();
          const password = passwordInput.value;

          emailInput.style.border = "";
          passwordInput.style.border = "";
          customMessage.textContent = "";
          formMessage.innerHTML = "";
          btnText.style.display = "none";
          btnLoader.style.display = "inline-block";

          if (!email || !password) {
            emailInput.style.border = "1px solid red";
            passwordInput.style.border = "1px solid red";
            customMessage.textContent = "Please enter your credentials";
            btnText.style.display = "inline-block";
            btnLoader.style.display = "none";
            return;
          }

          try {
            await signInWithEmailAndPassword(auth, email, password);

            failedAttempts = 0;
            localStorage.setItem("failedAttempts", failedAttempts);
            localStorage.removeItem("lockUntil");

            formMessage.style.color = "green";
            formMessage.innerHTML = "Login successful! Redirecting...";

            setTimeout(() => {
              window.location.href = "index.Se2.html";
            }, 1500);
          } catch (error) {
            emailInput.style.border = "1px solid red";
            passwordInput.style.border = "1px solid red";
            btnText.style.display = "inline-block";
            btnLoader.style.display = "none";

            failedAttempts++;
            localStorage.setItem("failedAttempts", failedAttempts);

            let message = "Invalid email or password.";
            if (error.code === "auth/invalid-email")
              message = "Invalid email format.";

            customMessage.textContent = message;

            if (failedAttempts >= 3) {
              const lockTime = 5 * 60 * 1000;
              const unlockAt = Date.now() + lockTime;
              localStorage.setItem("lockUntil", unlockAt);
              loginButton.disabled = true;
              lockoutToast.style.display = "block";

              setTimeout(() => {
                loginButton.disabled = false;
                lockoutToast.style.display = "none";
                failedAttempts = 0;
                localStorage.setItem("failedAttempts", failedAttempts);
                localStorage.removeItem("lockUntil");
              }, lockTime);
            }
          }
        });

        const forgotForm = document.getElementById("forgotPasswordForm");
        if (forgotForm) {
          forgotForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const emailInputValue = forgotForm
              .querySelector("input")
              .value.trim();
            try {
              await sendPasswordResetEmail(auth, emailInputValue);
              alert("Password reset link sent to your email.");
              forgotForm.reset();
            } catch (error) {
              alert("Error: " + error.message);
            }
          });
        }
      });
    </script>

    <!-- ONLY ADDITION: GLOBAL PASSWORD TOGGLE -->
    <script>
      function togglePassword(inputId) {
        const input = document.getElementById(inputId);
        const button = input.parentElement.querySelector(".toggle-password i");

        if (input.type === "password") {
          input.type = "text";
          button.classList.remove("fa-eye");
          button.classList.add("fa-eye-slash");
        } else {
          input.type = "password";
          button.classList.remove("fa-eye-slash");
          button.classList.add("fa-eye");
        }
      }
    </script>
  </body>
</html>
